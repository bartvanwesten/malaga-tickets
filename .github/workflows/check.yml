name: Check

on:
  schedule:
    # Every 10 minutes (GitHub may start runs late or skip some under load). The script stops
    # checking after the target weekend; disable the workflow then.
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check: normal run · dry-run: log the mail only · test: send the welcome mail with what's online now to everyone · status: send the weekly status mail now"
        type: choice
        options: [check, dry-run, test, status]
        default: check

permissions:
  contents: write  # commit data/ (state and history)

concurrency:
  group: check

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MAIL_TO: ${{ secrets.MAIL_TO }}
      STATUS_TO: ${{ secrets.STATUS_TO }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}  # Gmail app password
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}  # fallback: reaches STATUS_TO only
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-dev

      - name: Check the ticket site
        run: |
          case "${{ inputs.mode }}" in
            dry-run) uv run python -m malaga.main --dry-run ;;
            test)    uv run python -m malaga.main --test ;;
            status)  uv run python -m malaga.main --status ;;
            *)       uv run python -m malaga.main ;;
          esac

      - name: Commit state
        run: |
          git config user.name "malaga-tickets[bot]"
          git config user.email "malaga-tickets@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -q -m "Update ticket state"
          git pull -q --rebase && git push -q
