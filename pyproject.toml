[project]
name = "malaga-tickets"
version = "0.1.0"
description = "Email alert when tickets for a new Málaga CF home match appear on entradas.malagacf.com"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1",
    "selectolax>=1.0.0",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/malaga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
